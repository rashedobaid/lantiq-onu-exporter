name: "CI"

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Ruff
        run: ruff check --output-format=github . && ruff format --check .
      - name: Actionlint
        run: actionlint

  Test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    env:
      MISE_PYTHON_VERSION: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
      - name: Install
        run: pip install -r requirements.txt -e ".[test]"
      - name: Test
        run: pytest -q

  Docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          load: true
          tags: lantiq-onu-exporter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name exporter -p 9877:9877 -e GPON_HOST=192.0.2.1 lantiq-onu-exporter:ci
          for _ in $(seq 1 15); do curl -sf localhost:9877/metrics > before.txt && break; sleep 1; done
          for _ in $(seq 1 30); do docker logs exporter 2>&1 | grep -q "collection failed" && break; sleep 1; done
          curl -sf localhost:9877/metrics > after.txt
          docker logs exporter
          for f in before.txt after.txt; do
            grep -E '^gpon_up 0\.0$' "$f"
            grep -E '^gpon_uptime_seconds NaN$' "$f"
            grep -E '^gpon_ploam_state NaN$' "$f"
          done
          docker logs exporter 2>&1 | grep "WARNING collection failed"
      - name: Stop container
        if: always()
        run: docker rm -f exporter || true
