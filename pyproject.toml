[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lantiq-onu-exporter"
version = "0.1.1"
description = "Prometheus exporter for Lantiq Falcon based GPON SFP ONU sticks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["paramiko>=3.0", "prometheus-client>=0.17"]
keywords = ["gpon", "ont", "onu", "sfp", "lantiq", "prometheus", "exporter"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
lantiq-onu-exporter = "lantiq_onu_exporter.__main__:main"

[tool.setuptools]
packages = ["lantiq_onu_exporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
